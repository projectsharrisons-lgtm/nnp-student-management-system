{% extends "layouts/dashboard_layout.html" %}
{% block dashboard_content %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <!-- Stat Card 1 -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                <i class="fas fa-user-graduate text-xl"></i>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-sm font-medium text-gray-600">Total Students</p>
                <p class="text-lg font-semibold text-gray-700">Loading...</p>
            </div>
        </div>
    </div>
    <!-- Stat Card 2 -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-green-100 text-green-600">
                <i class="fas fa-chalkboard-teacher text-xl"></i>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-sm font-medium text-gray-600">Total Lecturers</p>
                <p class="text-lg font-semibold text-gray-700">Loading...</p>
            </div>
        </div>
    </div>
    <!-- Stat Card 3 -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                <i class="fas fa-building text-xl"></i>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-sm font-medium text-gray-600">Departments</p>
                <p class="text-lg font-semibold text-gray-700">Loading...</p>
            </div>
        </div>
    </div>
    <!-- Stat Card 4 -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        <div class="flex items-center">
            <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                <i class="fas fa-book text-xl"></i>
            </div>
            <div class="ml-4">
                <p class="mb-2 text-sm font-medium text-gray-600">Active Courses</p>
                <p class="text-lg font-semibold text-gray-700">Loading...</p>
            </div>
        </div>
    </div>
</div>

<!-- Chart Placeholder area -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-80 flex items-center justify-center">
        <p class="text-gray-400 font-medium">Activity Chart rendering in Phase 2</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-80 flex items-center justify-center">
        <p class="text-gray-400 font-medium">System Notifications rendering in Phase 2</p>
    </div>
</div>
{% endblock %}
