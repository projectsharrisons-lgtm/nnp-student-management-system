services:
  - type: web
    name: nnpsms-web
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nnpsms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: psql
    name: nnpsms-db
    plan: free
